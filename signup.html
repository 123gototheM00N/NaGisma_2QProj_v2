<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
    body {
    background-color: grey;
    }
    #drippin {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: blanchedalmond;
    border: 2px solid black;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    #hello {
    background-color: green;
    animation-name: myAnimation;
    animation-duration: 6s;
    }
    @keyframes myAnimation {
    0% {background-color: green;}
    25% {background-color: limegreen}
    50% {background-color: lime;}
    75% {background-color: greenyellow;}
    100% {background-color: yellow;}
    }
    #linky{
        display: flex;
        background-color: greenyellow;
        border: 2px solid black;
        width: 400px;
        text-align: left;
        padding: 10px;
    }
    </style>
</head>
<body>

    <div id="drippin">
<form id="signupForm" onsubmit="return validateForm();" novalidate>
        <h2 id="hello">Create Your Account</h2>
        
        <label for="fname">Full Name:</label><br>
        <input type="text" id="fname" name="fname" required>
        <span id="nameErr" class="error"></span><br><br>

        <label for="bday">Birthday:</label><br>
        <input type="date" id="bday" name="bday" required>
        <span id="dateErr" class="error"></span><br><br>

        <label>Sex:</label><br>
        <input type="radio" name="sex" value="Male"> Male
        <input type="radio" name="sex" value="Female"> Female
        <input type="radio" name="sex" value="Other"> Other
        <span id="sexErr" class="error"></span><br><br>

        <label for="mail">Email:</label><br>
        <input type="email" id="mail" name="mail" required>
        <span id="mailErr" class="error"></span><br><br>

        <label for="uname">Username:</label><br>
        <input type="text" id="uname" name="uname" required>
        <span id="userErr" class="error"></span><br><br>

        <label for="psc">Password:</label><br>
        <input type="password" id="psc" name="psc" required>
        <span id="passErr" class="error"></span><br><br>

        <label for="confirm">Confirm Password:</label><br>
        <input type="password" id="confirm" name="confirm" required>
        <span id="confirmErr" class="error"></span><br><br>

        <hr>
        <label for="interest">What Nature related topic are you into?</label><br>
        <select id="interest" name="interest">
            <option value="">-- Select One --</option>
            <option value="agriculture">Agriculture</option>
            <option value="biology">Biology</option>
            <option value="zoology">Zoology</option>
        </select>
        <span id="selectErr" class="error"></span><br><br>

        <label>Which flowers do you like? (Check at least one):</label><br>
        <input type="checkbox" name="flowers" value="hibiscus"> Hibiscus
        <input type="checkbox" name="flowers" value="dahila"> Dahila
        <input type="checkbox" name="flowers" value="sunflower"> Sunflower
        <span id="checkErr" class="error"></span><br><br>

        <label for="scale">On a scale of 1 to 10, how often do you garden:</label><br>
        <input type="number" id="scale" name="scale" max="10">
        <span id="numErr" class="error"></span><br><br>

        <input type="submit" value="Join the Busters!"> 
    </form>
    </div>

    <p id="successMsg"></p>
    <p id="linky">If you don't wan't to Sign up, then you can go <a href="index.html">Home</a></p>

<script src="script.js"></script>


</body>
</html>
